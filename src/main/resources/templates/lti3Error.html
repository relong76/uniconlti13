<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The launch didn't work</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/lti-pages.css}" />
</head>
<body>
<header class="app-bar">Unicon LTI 1.3 Demo</header>
<main class="page">
    <h1>The launch didn't work</h1>
    <p class="lead">The tool couldn't complete the launch from your LMS. Try launching again from your course; if it keeps happening, send the details below to whoever looks after this tool.</p>
    <div class="alert error" role="alert">
        <span class="alert-title">What went wrong</span>
        <p th:text="${Error}"></p>
    </div>
</main>
</body>
</html>
